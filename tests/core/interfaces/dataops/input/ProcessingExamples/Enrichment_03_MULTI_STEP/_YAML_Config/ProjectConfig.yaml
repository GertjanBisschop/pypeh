import_configs:
- id: peh:ENRICHMENT_TEST_IMPORT_CONFIG
  layout: peh:ENRICHMENT_TEST_DATA_LAYOUT
  section_mapping:
    section_mapping_links:
    - section: peh:ENRICHMENT_TEST_SUBJECTUNIQUE
      observation_id_list:
      - peh:ENRICHMENT_TEST_OBSERVATION_SUBJECTUNIQUE_INGESTED
    - section: peh:ENRICHMENT_TEST_ENRICH
      observation_id_list:
      - peh:ENRICHMENT_TEST_OBSERVATION_SUBJECT_ENRICHED_BASE
layouts:
- id: peh:ENRICHMENT_TEST_DATA_LAYOUT
  name: ENRICHMENT_TEST_DATA_LAYOUT
  ui_label: ENRICHMENT_TEST_DATA_LAYOUT
  sections:
  - id: peh:ENRICHMENT_TEST_SUBJECTUNIQUE
    ui_label: SUBJECTUNIQUE
    observable_entity_type: person
    section_type: data_table
    elements:
    - label: id_subject
      observable_property: peh:id_subject
      is_observable_entity_key: true
    - label: current_year
      observable_property: peh:current_year
    - label: current_month
      observable_property: peh:current_month
    - label: current_day
      observable_property: peh:current_day
    - label: N1Birthdate
      observable_property: peh:N1Birthdate
  - id: peh:ENRICHMENT_TEST_ENRICH
    ui_label: ENRICH_BASE
    observable_entity_type: person
    section_type: data_table
    elements:
    - label: id_subject
      observable_property: peh:id_subject
      is_observable_entity_key: true
      foreign_key_link:
        section: peh:ENRICHMENT_TEST_SUBJECTUNIQUE
        label: id_subject
    - label: N2Birthweight
      observable_property: peh:N2Birthweight
observation_designs:
- id: peh:ENRICHMENT_TEST_OBSERVATION_SUBJECTUNIQUE_INGESTED_DESIGN
  observation_result_type: measurement
  observable_entity_type: person
  observable_property_specifications:
  - observable_property: peh:id_subject
    specification_category: identifying
  - observable_property: peh:current_year
    specification_category: optional
  - observable_property: peh:current_month
    specification_category: optional
  - observable_property: peh:current_day
    specification_category: optional
  - observable_property: peh:N1Birthdate
    specification_category: optional
- id: peh:ENRICHMENT_TEST_OBSERVATION_SUBJECT_ENRICHED_BASE_DESIGN
  observation_result_type: calculation
  observable_entity_type: person
  observable_property_specifications:
  - observable_property: peh:id_subject
    specification_category: identifying
  - observable_property: peh:N2Birthweight
    specification_category: optional
- id: peh:ENRICHMENT_TEST_OBSERVATION_SUBJECT_ENRICHED_DESIGN
  observation_result_type: calculation
  observable_entity_type: person
  observable_property_specifications:
  - observable_property: peh:id_subject
    specification_category: identifying
  - observable_property: peh:Todaysdate
    specification_category: optional
    calculation_design:
      calculation_name: date_from_year_month_day
      calculation_implementation:
        function_name: tests.core.interfaces.dataops.enrichment_functions.date_from_year_month_day
        function_kwargs:
        - mapping_name: year
          contextual_field_reference:
            dataset_label: peh:ENRICHMENT_TEST_OBSERVATION_SUBJECTUNIQUE_INGESTED
            field_label: peh:current_year
          process_state: clean
          unit: UNITLESS
        - mapping_name: month
          contextual_field_reference:
            dataset_label: peh:ENRICHMENT_TEST_OBSERVATION_SUBJECTUNIQUE_INGESTED
            field_label: peh:current_month
          process_state: clean
          unit: UNITLESS
        - mapping_name: day
          contextual_field_reference:
            dataset_label: peh:ENRICHMENT_TEST_OBSERVATION_SUBJECTUNIQUE_INGESTED
            field_label: peh:current_day
          process_state: clean
          unit: UNITLESS
        function_results:
        - value_type: date
          unit: UNITLESS
  - observable_property: peh:agemonths
    specification_category: optional
    calculation_design:
      calculation_name: age_in_months_from_birth_and_interview_dates
      calculation_implementation:
        function_name: tests.core.interfaces.dataops.enrichment_functions.age_in_months_from_birth_and_interview_dates
        function_kwargs:
        - mapping_name: birth_date
          contextual_field_reference:
            dataset_label: peh:ENRICHMENT_TEST_OBSERVATION_SUBJECTUNIQUE_INGESTED
            field_label: peh:N1Birthdate
          process_state: clean
          unit: UNITLESS
        - mapping_name: interview_date
          contextual_field_reference:
            dataset_label: peh:ENRICHMENT_TEST_OBSERVATION_SUBJECT_ENRICHED
            field_label: peh:Todaysdate
          process_state: clean
          unit: UNITLESS
        function_results:
        - value_type: integer
          unit: MO
  - observable_property: peh:transformed-weight
    specification_category: optional
    calculation_design:
      calculation_name: transfomred_birthweight
      calculation_implementation:
        function_name: tests.core.interfaces.dataops.enrichment_functions.transform_birthweight
        function_kwargs:
        - mapping_name: birthweight
          contextual_field_reference:
            dataset_label: peh:ENRICHMENT_TEST_OBSERVATION_SUBJECT_ENRICHED_BASE
            field_label: peh:N2Birthweight
          process_state: clean
          unit: UNITLESS
        - mapping_name: constant
          value: "10.0"
          value_type: float
observations:
- id: peh:ENRICHMENT_TEST_OBSERVATION_SUBJECTUNIQUE_INGESTED
  name: ENRICHMENT_TEST_OBSERVATION_SUBJECTUNIQUE_INGESTED
  observation_design: peh:ENRICHMENT_TEST_OBSERVATION_SUBJECTUNIQUE_INGESTED_DESIGN
  observation_result_id_list:
  - peh:INGESTION_RESULT_20251001_01
- id: peh:ENRICHMENT_TEST_OBSERVATION_SUBJECT_ENRICHED_BASE
  name: ENRICHMENT_TEST_OBSERVATION_SUBJECT_ENRICHED_BASE
  observation_design: peh:ENRICHMENT_TEST_OBSERVATION_SUBJECT_ENRICHED_BASE_DESIGN
  observation_result_id_list:
  - peh:ENRICHMENT_BASE_RESULT_20251001_01
- id: peh:ENRICHMENT_TEST_OBSERVATION_SUBJECT_ENRICHED
  name: ENRICHMENT_TEST_OBSERVATION_SUBJECT_ENRICHED
  observation_design: peh:ENRICHMENT_TEST_OBSERVATION_SUBJECT_ENRICHED_DESIGN
  observation_result_id_list:
  - peh:ENRICHMENT_RESULT_20251001_01
